services:
  - type: web
    name: constex-backend
    runtime: node
    buildCommand: npm ci --production
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /tmp/constex-data
      - key: CACHE_TTL_HOURS
        value: 6
      - key: AV_CACHE_TTL_HOURS
        value: 23
      - key: REPORT_REFRESH_HOUR
        value: 7
      - key: FREE_REPORT_CAP
        value: 10
      - key: PAID_REPORT_CAP
        value: 100
      - key: NOTION_USERS_DB
        value: 3adc7f8e-47b4-8189-af58-c8911e8d990a
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
