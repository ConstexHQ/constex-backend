app = "constex-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  CACHE_TTL_HOURS = "6"
  AV_CACHE_TTL_HOURS = "23"
  REPORT_REFRESH_HOUR = "7"
  FREE_REPORT_CAP = "10"
  PAID_REPORT_CAP = "100"

[[mounts]]
  source = "constex_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
